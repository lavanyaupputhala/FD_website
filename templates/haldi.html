<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
    body {
        text-align: center;

        display: flex;

  #bigImage {
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    touch-action: none;
user-select: none;
-webkit-user-select: none;
}

#zoomIn,
#zoomOut {

    background: white;
    border: none;

    width: 45px;

    cursor: pointer;

    z-index: 10002;
}

#zoomOut {

}

#zoomIn {

    /* PREVIOUS */

</div>
<script>

const images = document.querySelectorAll(".gallery img");

const viewer = document.getElementById("viewer");
const bigImage = document.getElementById("bigImage");
const previous = document.getElementById("previous");
const next = document.getElementById("next");
const close = document.getElementById("close");
const threeDots = document.getElementById("threeDots");
const viewerMenu = document.getElementById("viewerMenu");
const share = document.getElementById("share");
const book = document.getElementById("book");

let current = 0;

/* =========================
   ZOOM + IMAGE MOVE
========================= */

let zoomLevel = 1;
let translateX = 0;
let translateY = 0;

function updateImageTransform() {

    bigImage.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${zoomLevel})`;

}

function resetZoom() {

    zoomLevel = 1;
    translateX = 0;
    translateY = 0;

    updateImageTransform();

}


/* =========================
   PINCH ZOOM + DRAG
========================= */

let startDistance = 0;
let startZoom = 1;

let isDragging = false;

let imageStartX = 0;
let imageStartY = 0;

let startTranslateX = 0;
let startTranslateY = 0;


/* TOUCH START */

bigImage.addEventListener("touchstart", function(event) {

    event.stopPropagation();

    if (event.touches.length === 2) {

        startDistance = Math.hypot(
            event.touches[0].clientX - event.touches[1].clientX,
            event.touches[0].clientY - event.touches[1].clientY
        );

        startZoom = zoomLevel;

        isDragging = false;

    }

    else if (
        event.touches.length === 1 &&
        zoomLevel > 1
    ) {

        isDragging = true;

        imageStartX = event.touches[0].clientX;
        imageStartY = event.touches[0].clientY;

        startTranslateX = translateX;
        startTranslateY = translateY;

    }

});


/* TOUCH MOVE */

bigImage.addEventListener("touchmove", function(event) {

    event.preventDefault();
    event.stopPropagation();

    /* PINCH ZOOM */

    if (event.touches.length === 2) {

        const currentDistance = Math.hypot(
            event.touches[0].clientX - event.touches[1].clientX,
            event.touches[0].clientY - event.touches[1].clientY
        );

        const scaleChange =
            currentDistance / startDistance;

        zoomLevel =
            startZoom * scaleChange;

        if (zoomLevel < 1) {
            zoomLevel = 1;
        }

        if (zoomLevel > 4) {
            zoomLevel = 4;
        }

        updateImageTransform();

    }

    /* MOVE IMAGE */

    else if (
        event.touches.length === 1 &&
        isDragging &&
        zoomLevel > 1
    ) {

        translateX =
            startTranslateX +
            (event.touches[0].clientX - imageStartX);

        translateY =
            startTranslateY +
            (event.touches[0].clientY - imageStartY);

        updateImageTransform();

    }

});


/* TOUCH END */

bigImage.addEventListener("touchend", function(event) {

    event.stopPropagation();

    if (event.touches.length === 0) {

        isDragging = false;

    }

});


/* =========================
   OPEN IMAGE
========================= */

images.forEach(function(image, index) {

    image.addEventListener("click", function(event) {

        event.stopPropagation();

        current = index;

        bigImage.src = image.src;

        resetZoom();

        viewer.style.display = "flex";

        viewerMenu.style.display = "none";

    });

});


/* =========================
   NEXT IMAGE
========================= */

next.addEventListener("click", function(event) {

    event.stopPropagation();

    current++;

    if (current >= images.length) {

        current = 0;

    }

    bigImage.src = images[current].src;

    resetZoom();

});


/* =========================
   PREVIOUS IMAGE
========================= */

previous.addEventListener("click", function(event) {

    event.stopPropagation();

    current--;

    if (current < 0) {

        current = images.length - 1;

    }

    bigImage.src = images[current].src;

    resetZoom();

});


/* =========================
   CLOSE
========================= */

close.addEventListener("click", function(event) {

    event.stopPropagation();

    viewer.style.display = "none";

    viewerMenu.style.display = "none";

    resetZoom();

});


/* =========================
   THREE DOTS
========================= */

threeDots.addEventListener("click", function(event) {

    event.stopPropagation();

    if (viewerMenu.style.display === "block") {

        viewerMenu.style.display = "none";

    }

    else {

        viewerMenu.style.display = "block";

    }

});


/* =========================
   WHATSAPP BOOKING
========================= */

book.addEventListener("click", function(event) {

    event.stopPropagation();

    const imageLink = bigImage.src;

    const ownerNumber = "7093235437";

    const message =
        "Hello, I am interested in this Haldi decoration.\n\n" +
        "Please check the selected decoration:\n" +
        imageLink +
        "\n\n" +
        "Please share the price and details.";

    window.open(
        "https://wa.me/" +
        ownerNumber +
        "?text=" +
        encodeURIComponent(message),
        "_blank"
    );

});


/* =========================
   SHARE THROUGH WHATSAPP
========================= */

share.addEventListener("click", function(event) {

    event.stopPropagation();

    const imageLink = bigImage.src;

    const message =
        "Check out this Haldi decoration:\n" +
        imageLink;

    window.open(
        "https://wa.me/?text=" +
        encodeURIComponent(message),
        "_blank"
    );

});


/* =========================
  /* =========================
   MOBILE SWIPE
========================= */

let swipeStartX = 0;
let imageTouchActive = false;

viewer.addEventListener("touchstart", function(event) {

    /* Ignore touches directly on the image */
    if (event.target === bigImage) {

        imageTouchActive = true;
        return;

    }

    if (event.touches.length === 1) {

        swipeStartX =
            event.touches[0].clientX;

        imageTouchActive = false;

    }

});


viewer.addEventListener("touchend", function(event) {

    /* Never treat image zoom/drag as swipe */
    if (imageTouchActive) {

        imageTouchActive = false;
        return;

    }

    /* If image is zoomed, don't change image */
    if (zoomLevel > 1) {
        return;
    }

    const endX =
        event.changedTouches[0].clientX;

    const difference =
        swipeStartX - endX;

    if (difference > 50) {

        next.click();

    }

    else if (difference < -50) {

        previous.click();

    }

});

/* =========================
   CLICK OUTSIDE = CLOSE
========================= */

viewer.addEventListener("click", function(event) {

    if (event.target === viewer) {

        viewer.style.display = "none";

        viewerMenu.style.display = "none";

        resetZoom();

    }

});

</script>
</body>
