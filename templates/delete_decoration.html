<!DOCTYPE html>
<html>

<head>

    <title>Delete Decoration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        h1 {
            text-align: center;
        }

        .category-select {
            text-align: center;
            margin: 25px 0;
        }

        #category {
            padding: 10px;
            font-size: 16px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .photo {
            border: 3px solid transparent;
            border-radius: 10px;
            padding: 4px;
            cursor: pointer;
        }

        .photo img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .photo.selected {
            border: 3px solid red;
        }

        #deleteButton {
            display: block;
            margin: 30px auto;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #deleteButton:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .photo img {
                height: 180px;
            }

        }

    </style>

</head>

<body>

<h1>🗑️ Delete Decoration</h1>


<div class="category-select">

    <label>
        <strong>Choose Category:</strong>
    </label>

    <select id="category">

        <option value="">Select Category</option>

        <option value="Haldi">🌼 Haldi</option>

        <option value="Wedding">💍 Wedding</option>

        <option value="Birthday">🎂 Birthday</option>

    </select>

</div>


<form method="POST" action="/delete-decoration">

    <input
        type="hidden"
        id="image_path"
        name="image_path"
    >

    <div class="gallery" id="gallery">


        <!-- HALDI FIXED IMAGES -->

        <div class="photo" data-category="Haldi"
             data-path="images/haldi (1).jpeg">

            <img src="{{ url_for('static', filename='images/haldi (1).jpeg') }}">

        </div>

        <div class="photo" data-category="Haldi"
             data-path="images/haldi2.jpeg">

            <img src="{{ url_for('static', filename='images/haldi2.jpeg') }}">

        </div>

        {% for i in range(3, 56) %}

        <div class="photo"
             data-category="Haldi"
             data-path="images/haldi ({{ i }}).jpeg">

            <img src="{{ url_for('static', filename='images/haldi (' ~ i ~ ').jpeg') }}">

        </div>

        {% endfor %}


        <!-- WEDDING FIXED IMAGES -->

        {% for i in range(1, 69) %}

        <div class="photo"
             data-category="Wedding"
             data-path="images/wedding ({{ i }}).jpeg">

            <img src="{{ url_for('static', filename='images/wedding (' ~ i ~ ').jpeg') }}">

        </div>

        {% endfor %}


        <!-- BIRTHDAY FIXED IMAGES -->

        {% for i in range(1, 18) %}

        <div class="photo"
             data-category="Birthday"
             data-path="images/birth ({{ i }}).jpeg">

            <img src="{{ url_for('static', filename='images/birth ({{ i }}).jpeg') }}">

        </div>

        {% endfor %}


        <!-- NEWLY UPLOADED IMAGES -->

        {% for decoration in decorations %}

        <div class="photo"
             data-category="{{ decoration['category'] }}"
             data-path="uploads/{{ decoration['image'] }}">

            <img src="{{ url_for('static', filename='uploads/' + decoration['image']) }}">

        </div>

        {% endfor %}


    </div>


    <button
        type="submit"
        id="deleteButton"
        disabled
    >
        🗑️ Delete Selected Decoration
    </button>

</form>


<a class="back" href="/owner">
    ⬅ Back to Dashboard
</a>


<script>

const category = document.getElementById("category");

const photos = document.querySelectorAll(".photo");

const imagePath = document.getElementById("image_path");

const deleteButton = document.getElementById("deleteButton");


category.addEventListener("change", function () {

    const selectedCategory = category.value;

    imagePath.value = "";

    deleteButton.disabled = true;

    photos.forEach(function (photo) {

        photo.classList.remove("selected");

        if (
            selectedCategory &&
            photo.dataset.category === selectedCategory
        ) {

            photo.style.display = "block";

        } else {

            photo.style.display = "none";

        }

    });

});


photos.forEach(function (photo) {

    photo.addEventListener("click", function () {

        photos.forEach(function (item) {
            item.classList.remove("selected");
        });

        photo.classList.add("selected");

        imagePath.value = photo.dataset.path;

        deleteButton.disabled = false;

    });

});

</script>

</body>

</html>
